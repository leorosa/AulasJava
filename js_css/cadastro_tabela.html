<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    table {
/*        border: 1px;*/
        width: 100%;
    }
    th {
        background-color: rgb(0,132,255);
        color: white;
        font-weight: bold;
        text-align: left;
    }
</style>
<script>
    function atualizaTabela() {
        if (typeof(Storage) !== "undefined") {
            pessoas = JSON.parse(localStorage.getItem("pessoas")) // Retrieve
        } else {
            alert("no Web storage support!")
            return
        }
        console.log(pessoas)
        const tbody = document.querySelector("#tabelaClientes tbody")
        tbody.innerHTML = ''
        for (n=0; n<pessoas.length; n++) {
            const linha = document.createElement('tr')
            linha.innerHTML = ''
            linha.innerHTML += '<td>'+pessoas[n].nome+'</td>'
            linha.innerHTML += '<td>'+pessoas[n].email+'</td>'
            linha.innerHTML += '<td>'+pessoas[n].telefone+'</td>'
            tbody.appendChild(linha)
        }
    }
</script>
</head>

<body>
<h3>Lista de Clientes</h3>
<table id="tabelaClientes">
    <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
        </tr>
    </thead>
    <tbody>
        <!-- Clientes serão inseridos aqui -->
    </tbody>
</table>
<script>atualizaTabela()</script>
</body>
</html>
