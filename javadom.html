<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="hdr1">Cabeçalho</h1>
    <p id="data"></p>
    <form id="frm1">
        <input type="text" id="nome" value="Ana" />
        <input type="text" id="email" value="ana@gmail.com" />
    </form>

    <p class="demo">One</p>
    <p class="demo">Two</p>
    <p id="demo"></p>

    <button type="button"
        onclick="document.getElementById('hdr1').style.color = 'red'">
    Click Me!</button>

    <script>
        const inputNome = document.getElementById("nome")
        console.log(inputNome)
        const inputEmail = document.getElementById("email")
        console.log(inputEmail.value)

        const inputs = document.getElementsByTagName("input")
        console.log(inputs[0])

        const myItems = document.querySelectorAll(".demo");
        myItems[0].innerHTML = "First";

        const x = document.forms["frm1"];
        let text = "";
        for (let i = 0; i < x.length; i++) {
            text += x.elements[i].value + "<br>"
        }
        document.getElementById("demo").innerHTML = text

        const element = document.getElementById("hdr1")
        element.innerHTML = element.innerHTML + " alterado"

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        async function demo() {
            while (true) {
                document.getElementById("data").innerHTML = "Date : " + Date();
                await sleep(1000);
            }
        }
        demo()

    </script>
</body>
</html>
