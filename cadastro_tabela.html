<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    table {
/*        border: 1px;*/
        width: 100%;
    }
    th {
        background-color: rgb(0,132,255);
        color: white;
        font-weight: bold;
        text-align: left;
    }
</style>
<script>
    function geraTabela() {
        if (typeof(Storage) !== "undefined") {
            pessoas = JSON.parse(localStorage.getItem("pessoas")) // Retrieve
        } else {
            alert("no Web storage support!")
            return
        }
        console.log(pessoas)
        var tabela = '<table>'
        tabela += '<tr>'
        tabela += '<th>#</th>'
        tabela += '<th>nome</th>'
        tabela += '<th>email</th>'
        tabela += '<th>telefone</th>'
        tabela += '</tr>'
        for (n=0; n<pessoas.length; n++) {
            tabela += '<tr>'
            tabela += '<td>'+(n+1)+'</td>'
            tabela += '<td>'+pessoas[n].nome+'</td>'
            tabela += '<td>'+pessoas[n].email+'</td>'
            tabela += '<td>'+pessoas[n].telefone+'</td>'
            tabela += '</tr>'
        }
        tabela += '</table>'
        div = document.getElementById('lista')
        div.innerHTML = tabela
    }
</script>
</head>

<body>
<h3>Lista de Clientes</h3>
<div id="lista"></div>
</div>
<script>geraTabela()</script>
</body>
</html>
