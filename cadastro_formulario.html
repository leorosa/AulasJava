<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    #cadastro {
        width: 40%;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 0px 1px 1px rgba(0,0,0,0.1);
        padding: 15px;
    }
    button {
        width: 100px;
        background-color: rgb(0, 132, 255);
        color: white;
        border: none;
        border-radius: 5px;

    }
    input {
        width: 100%;
        border-width: 1px;
        border-color: rgba(0,0,0,0.5);
    }
</style>
<script>
    pessoas = []
    function inserePessoa() {
        event.preventDefault();
        nome = document.getElementById('nome').value
        email = document.getElementById('email').value
        telefone = document.getElementById('telefone').value
        pessoas.push({nome: nome, email: email, telefone: telefone})
        document.getElementById('formulario').reset()
        if (typeof(Storage) !== "undefined") {
            localStorage.setItem("pessoas", JSON.stringify(pessoas)) // Store
        } else {
            alert("no Web storage support!")
        }
//        const retpessoas = JSON.parse(localStorage.getItem("pessoas"))
//        console.log(retpessoas[0].nome)
        window.open('cadastro_tabela.html', '_blank');
    }
</script>
</head>

<body>
<h2>Cadastro de Clientes</h2>
<div id="cadastro">
    <form id="formulario" onsubmit="inserePessoa()">
        <label for="nome">Nome</label>
        <br>
        <input type="text" id="nome" />
        <br>
        <label for="email">E-mail</label>
        <br>
        <input type="email" id="email" />
        <br>
        <label for="telefone">Telefone</label>
        <br>
        <input type="number" id="telefone" />
        <br>
        <button onclick="inserePessoa()">Cadastrar</button>
    </form>
</div>

</body>
</html>
