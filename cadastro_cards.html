<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }
        #cartoes {
            display: flex;
            flex-wrap: wrap;
        }
        .cartao {
            width: 300px;
            margin: 10px;
            padding: 5px;
            background-color: white;
/*            border-style: solid;
            border-width: 1px; */
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .cartao:hover {
            transform: translate(-2px, -2px);
            transition: 0.3s ease;
        }
        button {
            background-color: rgb(0, 132, 255);
            color: white;
            border: none;
            border-radius: 5px;
            margin: 5px;
            padding: 10px;
        }
        input {
            width: 100%;
            background-color: white;
            border-color: white;
            border-style: solid;
            border-width: 0.1px;
        }
    </style>
</head>

<body>
<h3>Clientes Cadastrados</h3>
<div id="cartoes"></div>
<p id="alertas"></p>

<script>
    if (typeof(Storage) === "undefined") {
        document.getElementById('p').innerHTML = "no Web storage support!"
    } else {
        pessoas = JSON.parse(localStorage.getItem("pessoas")) || [] // Retrieve
        function removeRegistro(n) {
            pessoas.splice(n, 1)
            localStorage.setItem("pessoas", JSON.stringify(pessoas))
            location.reload();
        }
        function editarRegistro(n, nome, email, telefone, bedit, bdel) {
            nome.disabled = ""
            email.disabled = ""
            telefone.disabled = ""
            nome.style.borderColor = "black"
            email.style.borderColor = "black"
            telefone.style.borderColor = "black"
            bedit.innerHTML = "atualizar"
            bedit.onclick = function() { atualizaRegistro(n, nome, email, telefone, bedit, bdel); }
            bdel.innerHTML = "cancelar"
            bdel.onclick = function() { cancelaEdicao(n, nome, email, telefone, bedit, bdel); }
        }
        function atualizaRegistro(n, nome, email, telefone, bedit, bdel) {
            pessoas[n].nome = nome.value
            pessoas[n].email = email.value
            pessoas[n].telefone = telefone.value
            localStorage.setItem("pessoas", JSON.stringify(pessoas))
            cancelaEdicao(n, nome, email, telefone, bedit, bdel);
            location.reload();
        }
        function cancelaEdicao(n, nome, email, telefone, bedit, bdel) {
            nome.style.borderColor = "white"
            email.style.borderColor = "white"
            telefone.style.borderColor = "white"
            nome.disabled = true
            email.disabled = true
            telefone.disabled = true
            bedit.innerHTML = "editar"
            bedit.onclick = function() { editarRegistro(n, nome, email, telefone, bedit, bdel); }
            bdel.innerHTML = "remover"
            bdel.onclick = function() { removeRegistro(n); }
        }
        const div = document.getElementById("cartoes")
//      for (let n=0; n<pessoas.length; n++) {
        pessoas.forEach((pessoa,n) => {
            const cdiv = document.createElement('div')
            cdiv.className = "cartao"
            const nome = document.createElement('input')
            nome.type = "text"
            //nome.style.border = "none"
            nome.style.color = "blue"
            nome.style.fontSize = "18pt"
            nome.style.fontWeight = "bold"
            nome.disabled = "true"
            nome.value = pessoa.nome
            cdiv.appendChild(nome)
            const epar = document.createElement('p')
            const elabel = document.createElement('label')
            elabel.innerHTML = "<b>E-mail:</b>"
            epar.append(elabel)
            const email = document.createElement('input')
            email.type = "text"
//            email.style.border = "none"
            //email.style.borderColor = "white"
            email.disabled = "true"
            email.value = pessoa.email
            epar.appendChild(email)
            cdiv.appendChild(epar)
            const tpar = document.createElement('p')
            const tlabel = document.createElement('label')
            tlabel.innerHTML = "<b>Telefone:</b>"
            tpar.append(tlabel)
            const telefone = document.createElement('input')
            telefone.type = "text"
            //telefone.style.border = "none"
            telefone.disabled = "true"
            telefone.value = pessoa.telefone
            tpar.appendChild(telefone)
            cdiv.appendChild(tpar)
            const bdiv = document.createElement('div')
            bdiv.style.display = "flex"
            bdiv.style.justifyContent = "space-between"
            const bedit = document.createElement('button')
            bedit.innerHTML = 'editar'
            bedit.onclick = function() { editarRegistro(n, nome, email, telefone, bedit, bdel); }
            const bdel = document.createElement('button')
            bdel.innerHTML = 'remover'
            bdel.style.backgroundColor = 'red'
            bdel.onclick = function() { removeRegistro(n); }
            bdiv.appendChild(document.createElement('span'))
            bdiv.appendChild(bedit)
            bdiv.appendChild(document.createElement('span'))
            bdiv.appendChild(bdel)
            bdiv.appendChild(document.createElement('span'))
            cdiv.appendChild(bdiv)
            div.appendChild(cdiv)
        })
    }
</script>
</body>
</html>
